server {
    listen 8080;
    server_name _;
    root /var/www/voltasegura;
    index index.html;
    access_log /var/log/nginx/voltasegura-access.log vs_privacy;
    error_log /var/log/nginx/voltasegura-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'web-ok\n';
    }
    location = /config.js { add_header Cache-Control 'no-store'; }
    location /api/ {
        default_type application/json;
        return 503 '{"error":"backend_not_connected"}';
    }
    location / { try_files $uri $uri/ =404; }
}
